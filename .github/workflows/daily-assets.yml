name: Prepare daily Instagram asset (12:00 Argentina)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-assets.yml'
      - 'commands/story-assets.json'
  schedule:
    - cron: '0 15 * * *'
permissions:
  contents: write
concurrency:
  group: daily-instagram-asset
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'Pillow>=10,<12'
      - name: Check generator syntax
        run: python -m py_compile generate_daily.py
      - name: Generate image and manifest
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            python -c 'import json; from pathlib import Path; from generate_daily import render_story; from datetime import datetime; from zoneinfo import ZoneInfo; p=Path("images")/datetime.now(ZoneInfo("America/Argentina/Buenos_Aires")).date().isoformat(); render_story(json.loads((p/"manifest.json").read_text())["topic_snapshot"],p)'
          else
            python generate_daily.py
          fi
      - name: Commit dated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/
          if ! git diff --cached --quiet; then
            git commit -m "Generate daily Instagram image"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
