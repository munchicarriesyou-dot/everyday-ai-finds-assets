name: Generate manual Instagram assets
on:
  push:
    branches: [main]
    paths:
      - 'commands/manual.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: manual-instagram-assets
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check failure lock
        id: failstop
        run: |
          if [ -f state/failstop-manual-assets.json ]; then
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
            echo 'BLOCKED: prior failure; no retry until reviewed'
          else
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.failstop.outputs.allowed == 'true'
        with:
          python-version: '3.12'
      - run: pip install 'Pillow>=10,<12'
        if: steps.failstop.outputs.allowed == 'true'
      - name: Validate generator
        if: steps.failstop.outputs.allowed == 'true'
        run: python -m py_compile generate_daily.py
      - name: Generate requested media and manifest
        if: steps.failstop.outputs.allowed == 'true'
        run: |
          REQUEST_ID=$(python -c 'import json; print(json.load(open("commands/manual.json"))["request_id"])')
          if [ -f "manual/$REQUEST_ID/manifest.json" ]; then
            echo "Manual request already generated; preserving existing media"
          else
            python generate_daily.py --manual-command commands/manual.json
          fi
      - name: Commit manual assets
        if: steps.failstop.outputs.allowed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manual/
          if ! git diff --cached --quiet; then
            git commit -m "Generate manual Instagram assets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Persist fail-stop lock
        if: failure() && steps.failstop.outputs.allowed == 'true'
        run: |
          mkdir -p state
          printf '{"blocked":true,"workflow":"manual-assets","run_id":"%s","reason":"Prior execution failed; manual review required"}\n' "$GITHUB_RUN_ID" > state/failstop-manual-assets.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/failstop-manual-assets.json
          git commit -m "Fail-stop manual-assets after failed run" || true
          git pull --rebase origin main
          git push origin HEAD:main
