name: Generate bonus artwork
on:
  push:
    paths:
      - '.github/workflows/bonus-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: python generate_bonus_20261123.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/bonus/
          git diff --cached --quiet || (git commit -m 'Generate bonus artwork' && git pull --rebase origin main && git push)
